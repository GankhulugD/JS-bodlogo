<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    
      >
    <style>
        /* Body */
        body {
            background: #1e1e1e;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Calculator container */
        .calculator {
            background: #2a2a2a;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 8px 8px 15px #141414, -8px -8px 15px #3a3a3a;
        }

        /* Display */
        .message-body {
            background: #2a2a2a;
            box-shadow: inset 5px 5px 10px #141414, inset -5px -5px 10px #3a3a3a;
            border-radius: 20px;
            padding: 10px 15px;
            font-size: clamp(1.2em, 2vw, 2em);
            color: #f0f0f0;
            text-align: right;
            min-height: 100px;  /* Илүү урт display */
            max-height: 150px;
            overflow-x: auto;   /* Урт текст scroll */
            overflow-y: hidden;
            white-space: nowrap;
            margin-bottom: 20px;
        }

        /* Buttons */
        .button {
            background: #2a2a2a;
            border-radius: 20px;
            box-shadow: 5px 5px 10px #141414, -5px -5px 10px #3a3a3a;
            color: #f0f0f0;
            transition: all 0.2s ease;
        }

        .button:active {
            box-shadow: inset 4px 4px 6px #141414, inset -4px -4px 6px #3a3a3a;
        }

        /* Operator buttons */
        .button.is-active {
            background: #3a3a3a;
            box-shadow: 5px 5px 10px #242424, -5px -5px 10px #4a4a4a;
        }

        /* Equals button */
        .button.is-danger {
            background: #ff4d6d;
            color: #fff;
            box-shadow: 5px 5px 10px #b33450, -5px -5px 10px #ff8ca0;
        }

        /* Grid spacing adjustments */
        .columns {
            justify-content: center;
        }

        /* Make buttons uniform */
        .button.column {
            width: 60px;
            height: 60px;
            margin: 5px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
   <div class="columns mt-6"> <!-- Bulma grid system: columns үүсгэж, дээрээс margin өгсөн -->
        <div class="column is-half is-offset-one-quarter"> <!-- 50% өргөнтэй багана, төвлөрсөн -->
            
            <article class="message"> <!-- Bulma message box -->
                <div class="message-body" id="result"> </div><!-- Доторх текстийг JavaScript-аар өөрчилнө -->
                
            </article>

            <div class="columns mb-5"> 
                <button class="button is-dark column ml-6 is-2" onclick="b_huvi();">%</button> 
                <button class="button is-dark column ml-4 is-2" onclick="b_ce();">CE</button> 
                <button class="button is-dark column ml-4 is-2" onclick="b_c();">C</button> 
                <button class="button is-active column ml-4 mr-6 is-2" onclick="b_backspace();">⌫</button> 
            </div> 
            <div class="columns mb-5"> 
                <button class="button is-dark column ml-6 is-2" onclick="b_1x();">1/x</button> 
                <button class="button is-dark column ml-4 is-2" onclick="b_x2();">x²</button> 
                <button class="button is-dark column ml-4 is-2" onclick="b_2x();">2√x</button> 
                <button class="button is-active column ml-4 mr-6 is-2" onclick="b_huwaah();">÷</button> 
            </div> 
            <div class="columns mb-5"> 
                <button class="button is-dark column ml-6 is-2" onclick="b7();">7</button> 
                <button class="button is-dark column ml-4 is-2" onclick="b8();">8</button> 
                <button class="button is-dark column ml-4 is-2" onclick="b9();">9</button> 
                <button class="button is-active column ml-4 mr-6 is-2" onclick="b_urjih();">×</button> 
            </div>   
            <div class="columns mb-5"> 
                <button class="button is-dark column ml-6 is-2" onclick="b4();">4</button> 
                <button class="button is-dark column ml-4 is-2" onclick="b5();">5</button> 
                <button class="button is-dark column ml-4 is-2" onclick="b6();">6</button> 
                <button class="button is-active column ml-4 mr-6 is-2" onclick="b_hasah();">-</button> 
            </div> 
            <div class="columns mb-5"> 
                <button class="button is-dark column ml-6 is-2" onclick="b1();">1</button> 
                <button class="button is-dark column ml-4 is-2" onclick="b2();">2</button> 
                <button class="button is-dark column ml-4 is-2" onclick="b3();">3</button> 
                <button class="button is-active column ml-4 mr-6 is-2" onclick="b_nemeh();">+</button> 
            </div> 
            <div class="columns mb-5"> 
                <button class="button is-dark column ml-6 is-2" onclick="b_temdeg();">+/-</button> 
                <button class="button is-dark column ml-4 is-2" onclick="b0();">0</button> 
                <button class="button is-dark column ml-4 is-2" onclick="b_tseg();">.</button> 
                <button class="button is-danger is-light column ml-4 mr-6 is-2" onclick="b_tentsuu();">=</button> 
            </div>
            

        </div> 
    </div> 

<script>
    let output = 0;
    let output2 = 0;
    let output3 = 0;

    function print() {
    document.getElementById("result").innerText = output;
    }
    function print3(){
    document.getElementById("result").innerText=output3;
    }

    function b0() { output = output*10 + 0; print(); }
    function b1() { output = output*10 + 1; print(); }
    function b2() { output = output*10 + 2; print(); }
    function b3() { output = output*10 + 3; print(); }
    function b4() { output = output*10 + 4; print(); }
    function b5() { output = output*10 + 5; print(); }
    function b6() { output = output*10 + 6; print(); }
    function b7() { output = output*10 + 7; print(); }
    function b8() { output = output*10 + 8; print(); }
    function b9() { output = output*10 + 9; print(); }

    function b_backspace() {
    output = output.toString().slice(0, -1);
    output = output === "" ? 0 : Number(output);
    print();
    }

    function b_huwaah() { output2 = output; output = 0; output3 = "÷"; print3();}
    function b_urjih()  { output2 = output; output = 0; output3 = "×"; print3();}
    function b_hasah()  { output2 = output; output = 0; output3 = "-"; print3();}
    function b_nemeh()  { output2 = output; output = 0; output3 = "+"; print3();}

    function b_ce() { output = 0; print(); }

    function b_c() { output = 0; output2 = 0; output3 = 0; print(); }

    function b_temdeg() { output = -output; print(); }

    function b_tseg() {
    if(!output.toString().includes('.')) 
    output = output + '.';
    print();
    }

    function b_huvi() { output = output / 100; print(); }

    function b_1x() {
        output = 1/output;
        print();
    }

    // x^2
    function b_x2() {
        output = output * output;
        print();
    }

    // 2√x 
    function b_2x() {
        if (output >= 0) {
            output = 2 * Math.sqrt(output);
            print();
        } else {
            alert("Сөрөг тооны квадрат үндсийг тооцож болохгүй!");
        }
    }

    // Decimal
    function b_tseg() { 
        if (!output.toString().includes('.')) {
            output = output.toString() + '.';
        }
        print();
    }


    function b_tentsuu() {
    if(output3 === "÷") output = output2 / output;
    else if(output3 === "×") output = output2 * output;
    else if(output3 === "-") output = output2 - output;
    else if(output3 === "+") output = output2 + output;
    print();
    output3 = 0;
    }
</script>

</body>
</html>
