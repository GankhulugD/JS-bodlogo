<!DOCTYPE html> <!-- Энэ бол HTML5 баримт бичиг гэж зааж өгч байгаа -->
<html lang="en"> <!-- Вэбийн бүх агуулга англи хэл дээр гэсэн утгатай -->
<head> <!-- Head хэсэг эхэлж байна (мэдээлэл, CSS холбоно) -->
    <meta charset="UTF-8"> <!-- UTF-8 кодчилол (Монгол текст зөв харагдана) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobile-д зохицуулалт -->
    <title>Document</title> <!-- Browser-ийн таб дээр харагдах нэр -->

    <!-- Bulma CSS-г CDN-ээр холбоно -->
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
  >

</head>
<body> <!-- Вэб дээр харагдах агуулга эхэлж байна -->

    <!-- Bulma-ийн багана layout ашиглаж байна -->
    <div class="columns mt-6"> <!-- columns = багана үүсгэнэ, mt-6 = дээрээс margin өгнө -->
        <div class="column is-half is-offset-one-quarter"> 
          <!-- column = нэг багана -->
          <!-- is-half = дэлгэцийн өргөний тал хувийг эзэлнэ -->
          <!-- is-offset-one-quarter = зүүнээс 1/4 хоосон орхиод төвд байрлуулна -->

        <div class="mb-4"> <!-- доогуур margin 4 нэгж -->
          <!-- 3 button -->
          <button class="button is-white" onclick="print();">White</button> <!-- цагаан товч, print() дуудагдана -->
          <button class="button is-black" onclick="bodlogo1();">Black</button> <!-- хар товч, bodlogo1() дуудагдана -->
          <button class="button is-dark" onclick="bodlogo2();">Dark</button> <!-- бараан товч, bodlogo2() дуудагдана -->
        </div>   
        
        <!-- Message box (Bulma загвар) -->
        <article class="message"> 
            <div class="message-body" id="result">
              <!-- Энд JS-ээс үр дүн (output) гарч ирнэ -->
            </div>
        </article>

        </div>
    </div>

<!-- JavaScript эхэлж байна -->
<script>

    let output; // Хоосон хувьсагч зарлаж байна (дараа нь утга хадгална)

    function print(){
      // #result гэсэн div дотор output хувьсагчийн утгыг бичнэ
      document.getElementById("result").innerText = output;
    }

    function bodlogo1(){
       // Бодлого 1: хөнгөлөлтийн үнийг олно
       let une = 40000; // үнэ
       let sale = 30;   // хөнгөлөлт %
       let salee = une/100*sale; // хөнгөлөгдөх дүн

       console.log(une/100*sale); // browser-ийн console дээр хэвлэнэ
       output = salee; // утгыг хадгална
       print(); // print() дуудаж дэлгэц дээр гаргана
    }

    // Бодлого 2: 3 тооны дунджийг олно
    function bodlogo2(){
       let neg = prompt("neg");     // хэрэглэгчээс тоо авна
       let hoyor = prompt("hoyor"); // хоёр дахь тоо
       let guraw = prompt("guraw"); // гурав дахь тоо

       // string-ийг Number болгоно
       let NEG = Number(neg);
       let HOYOR = Number(hoyor);
       let GURAW = Number(guraw);

       // дундаж олно
       let dundaj = (NEG + HOYOR + GURAW) / 3;

       console.log(dundaj); // console дээр хэвлэнэ
       output = dundaj; // үр дүнг хадгална
       print(); // дэлгэц дээр гаргана
    }

</script>

</body>
</html> <!-- HTML баримт бичиг дуусав -->
